[project]
name = "agent-architecture-book"
version = "0.1.0"
description = "A publishable GitHub Pages book on modern secure AI agent architecture."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6.0.2,<7",
]

[dependency-groups]
docs = [
  "mkdocs>=1.6.1,<2",
  "mkdocs-material>=9.7.6,<10",
  "mkdocs-glightbox>=0.5.2,<1",
  "mkdocs-static-i18n>=1.3.1,<2",
  "mkdocs-minify-plugin>=0.8.0,<1",
  "pymdown-extensions>=10.21,<11",
]
dev = [
  "ruff>=0.15.8,<0.16",
  "ty>=0.0.26,<0.1",
]
research = [
  "marimo>=0.21.1,<1",
  "polars>=1.39.3,<2",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["site"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
