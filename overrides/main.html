{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  <meta name="google-site-verification" content="RBNGmQi1EDhswKAfS_CtGf8o7FRuCmeI_mbYgB_xrwE" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="{{ page.title | default(config.site_name, true) | e }}" />
  <meta property="og:description" content="{{ config.site_description | e }}" />
  <meta property="og:url" content="{{ page.canonical_url | e }}" />
  <meta property="og:site_name" content="{{ config.site_name | e }}" />
  <meta property="og:image" content="{{ config.site_url }}assets/images/readme.png" />
  <meta property="og:image:width" content="1773" />
  <meta property="og:image:height" content="886" />
  <meta property="og:image:alt" content="{{ config.site_name | e }}" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{ page.title | default(config.site_name, true) | e }}" />
  <meta name="twitter:description" content="{{ config.site_description | e }}" />
  <meta name="twitter:image" content="{{ config.site_url }}assets/images/readme.png" />
  <meta name="twitter:image:alt" content="{{ config.site_name | e }}" />
{% endblock %}
