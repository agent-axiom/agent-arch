<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
<marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
<path d="M 0 0 L 12 6 L 0 12 z" fill="#64748b"/>
</marker>
<filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
<feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#94a3b8" flood-opacity="0.16"/>
</filter>
</defs>
<rect width="1600" height="900" fill="#f5f7fb"/>
<text x="70" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="44" font-weight="800" fill="#1f2937">Deployment simulation и целостность оценки</text>
<text x="72" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="25" font-weight="600" fill="#475569">Перед релизом нужно проверять и поведение агента, и надежность самого измерителя</text>

<rect x="80" y="240" width="250" height="135" rx="20" fill="#dbeafe" stroke="#1e293b" stroke-width="2" filter="url(#softShadow)"/>
<text x="205" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="23" font-weight="800" fill="#1f2937" text-anchor="middle">Исторические</text>
<text x="205" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="23" font-weight="800" fill="#1f2937" text-anchor="middle">контексты</text>
<text x="205" y="352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="650" fill="#475569" text-anchor="middle">privacy filtered</text>

<rect x="430" y="240" width="250" height="135" rx="20" fill="#dcfce7" stroke="#1e293b" stroke-width="2" filter="url(#softShadow)"/>
<text x="555" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="23" font-weight="800" fill="#1f2937" text-anchor="middle">Candidate</text>
<text x="555" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="23" font-weight="800" fill="#1f2937" text-anchor="middle">model/runtime</text>
<text x="555" y="352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="650" fill="#475569" text-anchor="middle">new policy/tool surface</text>

<rect x="780" y="240" width="250" height="135" rx="20" fill="#fef3c7" stroke="#1e293b" stroke-width="2" filter="url(#softShadow)"/>
<text x="905" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="23" font-weight="800" fill="#1f2937" text-anchor="middle">Tool</text>
<text x="905" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="23" font-weight="800" fill="#1f2937" text-anchor="middle">simulation</text>
<text x="905" y="352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="650" fill="#475569" text-anchor="middle">faults, latency, state</text>

<rect x="1130" y="240" width="300" height="135" rx="20" fill="#ede9fe" stroke="#1e293b" stroke-width="2" filter="url(#softShadow)"/>
<text x="1280" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="23" font-weight="800" fill="#1f2937" text-anchor="middle">Behavior delta</text>
<text x="1280" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="23" font-weight="800" fill="#1f2937" text-anchor="middle">и rollout gate</text>
<text x="1280" y="352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="650" fill="#475569" text-anchor="middle">block / warn / expand</text>

<line x1="330" y1="307" x2="410" y2="307" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="680" y1="307" x2="760" y2="307" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="1030" y1="307" x2="1110" y2="307" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

<rect x="255" y="520" width="1090" height="175" rx="22" fill="#ffffff" stroke="#1e293b" stroke-width="2" filter="url(#softShadow)"/>
<text x="800" y="565" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="800" fill="#1f2937" text-anchor="middle">eval_audit_record проверяет сам измеритель</text>
<text x="800" y="615" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="650" fill="#475569" text-anchor="middle">oracle_type • defect_labels • agent_audit_refs • human_reviewer_count</text>
<text x="800" y="655" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="650" fill="#475569" text-anchor="middle">human_agreement • reviewer_confidence • decision_impact</text>

<line x1="800" y1="375" x2="800" y2="500" stroke="#64748b" stroke-width="4" stroke-dasharray="10 10" marker-end="url(#arrow)"/>
<text x="70" y="863" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#64748b">Agent Axiom / Архитектура безопасных ИИ-агентов</text>
