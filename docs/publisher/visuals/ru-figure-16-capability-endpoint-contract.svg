<text x="95" y="756.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#475569" text-anchor="start" dominant-baseline="middle">Правило: расширение возможности проходит как изменение контракта, а не как незаметная</text>
