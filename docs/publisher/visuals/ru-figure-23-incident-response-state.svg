<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#64748b"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#94a3b8" flood-opacity="0.18"/></filter>
  </defs>
  <rect width="1600" height="900" fill="#f5f7fb"/>
  <text x="70" y="88" font-family="Arial, sans-serif" font-size="44" font-weight="800" fill="#1f2937">Контур реагирования на инцидент агента</text>
  <text x="70" y="130" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#475569">Не повторять действие, пока внешний эффект не установлен по доказательствам</text>
  <g font-family="Arial, sans-serif" text-anchor="middle" filter="url(#shadow)">
    <rect x="75" y="275" width="250" height="145" rx="16" fill="#dbeafe" stroke="#1e293b" stroke-width="2"/>
    <text x="200" y="325" font-size="25" font-weight="800" fill="#1f2937">1. Обнаружить</text><text x="200" y="365" font-size="18" fill="#475569">сигнал, жалоба, дрейф</text><text x="200" y="393" font-size="18" fill="#475569">trace_id и владелец</text>
    <rect x="385" y="275" width="250" height="145" rx="16" fill="#fee2e2" stroke="#1e293b" stroke-width="2"/>
    <text x="510" y="325" font-size="25" font-weight="800" fill="#1f2937">2. Сдержать</text><text x="510" y="365" font-size="18" fill="#475569">заморозить возможность</text><text x="510" y="393" font-size="18" fill="#475569">сузить волну и доступ</text>
    <rect x="695" y="275" width="250" height="145" rx="16" fill="#fef3c7" stroke="#1e293b" stroke-width="2"/>
    <text x="820" y="325" font-size="25" font-weight="800" fill="#1f2937">3. Проверить эффект</text><text x="820" y="365" font-size="18" fill="#475569">receipt и состояние</text><text x="820" y="393" font-size="18" fill="#475569">side_effect_unknown</text>
    <rect x="1005" y="275" width="250" height="145" rx="16" fill="#dcfce7" stroke="#1e293b" stroke-width="2"/>
    <text x="1130" y="325" font-size="25" font-weight="800" fill="#1f2937">4. Восстановить</text><text x="1130" y="365" font-size="18" fill="#475569">откат или исправление</text><text x="1130" y="393" font-size="18" fill="#475569">контрольный запуск</text>
    <rect x="1315" y="275" width="210" height="145" rx="16" fill="#ede9fe" stroke="#1e293b" stroke-width="2"/>
    <text x="1420" y="325" font-size="25" font-weight="800" fill="#1f2937">5. Научиться</text><text x="1420" y="365" font-size="18" fill="#475569">оценка и политика</text><text x="1420" y="393" font-size="18" fill="#475569">реестр и ADLC</text>
  </g>
  <g stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"><line x1="325" y1="348" x2="375" y2="348"/><line x1="635" y1="348" x2="685" y2="348"/><line x1="945" y1="348" x2="995" y2="348"/><line x1="1255" y1="348" x2="1305" y2="348"/></g>
  <rect x="155" y="535" width="1290" height="170" rx="18" fill="#ffffff" stroke="#1e293b" stroke-width="2" filter="url(#shadow)"/>
  <text x="800" y="580" font-family="Arial, sans-serif" font-size="24" font-weight="800" text-anchor="middle" fill="#1f2937">Единая полоса доказательств</text>
  <text x="800" y="625" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#475569">trace_id • session_id • approval_id • action_digest • idempotency_key • tool receipt • bundle_id • rollout_wave</text>
  <text x="800" y="670" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#b91c1c">Неизвестный внешний эффект блокирует слепой повтор</text>
  <text x="70" y="858" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#64748b">Agent Axiom / Архитектура безопасных ИИ-агентов</text>
</svg>
