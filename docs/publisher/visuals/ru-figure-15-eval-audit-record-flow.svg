<text x="1107.5" y="600.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="650" fill="#475569" text-anchor="middle" dominant-baseline="middle">урок</text>
<text x="120" y="736.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#475569" text-anchor="start" dominant-baseline="middle">Главная ценность: решение можно объяснить после запуска, а не реконструировать по</text>
