<text x="72" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="25" font-weight="600" fill="#475569">Агент получает не весь каталог инструментов, а управляемый срез возможностей</text>

