<text x="1045" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="650" fill="#475569" text-anchor="middle">identity / DLP / лимит частоты</text>
<text x="1045" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="650" fill="#475569" text-anchor="middle">граница подтверждения</text>
