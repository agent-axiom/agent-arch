<rect x="160" y="550" width="1280" height="140" rx="22" fill="#ffffff" stroke="#1e293b" stroke-width="2" filter="url(#softShadow)"/>
<text x="800" y="595" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="25" font-weight="800" fill="#1f2937" text-anchor="middle">Приватная достижимость должна быть узким маршрутом, а не общим сетевым мостом</text>
