<text x="1425" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="25" font-weight="800" fill="#1f2937" text-anchor="middle">серверы</text>
<text x="1425" y="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="650" fill="#475569" text-anchor="middle">разрешенный срез</text>

