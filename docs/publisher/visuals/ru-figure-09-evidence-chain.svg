<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#64748b"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#94a3b8" flood-opacity="0.18"/></filter></defs>
  <rect width="1600" height="900" fill="#f5f7fb"/>
  <text x="70" y="88" font-family="Arial, sans-serif" font-size="44" font-weight="800" fill="#1f2937">Цепочка доказательств</text>
  <text x="70" y="130" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#475569">От события запуска к решению о поэтапном выпуске</text>
