    <rect x="70" y="260" width="245" height="125" rx="16" fill="#dbeafe" stroke="#1e293b" stroke-width="2"/><text x="192" y="312" font-size="24" font-weight="800">Спаны трассы</text><text x="192" y="350" font-size="17" fill="#475569">вызовы и статусы</text>
    <rect x="390" y="260" width="245" height="125" rx="16" fill="#e0f2fe" stroke="#1e293b" stroke-width="2"/><text x="512" y="305" font-size="23" font-weight="800">Структурированные</text><text x="512" y="335" font-size="23" font-weight="800">события</text><text x="512" y="365" font-size="17" fill="#475569">решения и причины</text>
    <rect x="710" y="260" width="245" height="125" rx="16" fill="#fef9c3" stroke="#1e293b" stroke-width="2"/><text x="832" y="312" font-size="24" font-weight="800">Набор оценки</text><text x="832" y="350" font-size="17" fill="#475569">случаи и ожидания</text>
    <rect x="1030" y="260" width="245" height="125" rx="16" fill="#ede9fe" stroke="#1e293b" stroke-width="2"/><text x="1152" y="305" font-size="23" font-weight="800">Вердикт</text><text x="1152" y="335" font-size="23" font-weight="800">проверяющего</text><text x="1152" y="365" font-size="17" fill="#475569">pass, fail, blocked</text>
    <rect x="1350" y="260" width="180" height="125" rx="16" fill="#ffedd5" stroke="#1e293b" stroke-width="2"/><text x="1440" y="305" font-size="23" font-weight="800">Решение</text><text x="1440" y="335" font-size="23" font-weight="800">о выпуске</text><text x="1440" y="365" font-size="17" fill="#475569">wave или hold</text>
  </g>
  <g stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"><line x1="315" y1="322" x2="380" y2="322"/><line x1="635" y1="322" x2="700" y2="322"/><line x1="955" y1="322" x2="1020" y2="322"/><line x1="1275" y1="322" x2="1340" y2="322"/></g>
  <g font-family="Arial, sans-serif" text-anchor="middle" filter="url(#shadow)">
    <rect x="390" y="535" width="245" height="110" rx="16" fill="#fce7f3" stroke="#1e293b" stroke-width="2"/><text x="512" y="580" font-size="23" font-weight="800">SLO-сигнал</text><text x="512" y="615" font-size="17" fill="#475569">операционная граница</text>
    <rect x="710" y="535" width="245" height="110" rx="16" fill="#dcfce7" stroke="#1e293b" stroke-width="2"/><text x="832" y="580" font-size="23" font-weight="800">Регрессионный шлюз</text><text x="832" y="615" font-size="17" fill="#475569">может остановить выпуск</text>
    <rect x="1030" y="535" width="245" height="110" rx="16" fill="#ecfdf5" stroke="#1e293b" stroke-width="2"/><text x="1152" y="580" font-size="23" font-weight="800">Волна выпуска</text><text x="1152" y="615" font-size="17" fill="#475569">ограниченный охват</text>
  </g>
  <g stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"><line x1="512" y1="385" x2="512" y2="525"/><line x1="832" y1="385" x2="832" y2="525"/><line x1="1152" y1="385" x2="1152" y2="525"/></g>
  <text x="70" y="858" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#64748b">Agent Axiom / Архитектура безопасных ИИ-агентов</text>
