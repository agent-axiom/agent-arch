<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#64748b"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#94a3b8" flood-opacity="0.18"/></filter></defs>
  <rect width="1600" height="900" fill="#f5f7fb"/>
  <text x="70" y="88" font-family="Arial, sans-serif" font-size="44" font-weight="800" fill="#1f2937">Жизненный цикл записи памяти</text>
  <text x="70" y="130" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#475569">Постоянная память появляется только после проверки происхождения, области и срока жизни</text>
  <g font-family="Arial, sans-serif" text-anchor="middle" filter="url(#shadow)">
    <rect x="85" y="265" width="230" height="135" rx="16" fill="#dbeafe" stroke="#1e293b" stroke-width="2"/><text x="200" y="312" font-size="23" font-weight="800">Кандидат</text><text x="200" y="350" font-size="17" fill="#475569">факт или сводка</text><text x="200" y="376" font-size="17" fill="#475569">не доверять по умолчанию</text>
    <rect x="380" y="265" width="230" height="135" rx="16" fill="#fef3c7" stroke="#1e293b" stroke-width="2"/><text x="495" y="312" font-size="23" font-weight="800">Проверка</text><text x="495" y="350" font-size="17" fill="#475569">source и provenance</text><text x="495" y="376" font-size="17" fill="#475569">тип и уверенность</text>
    <rect x="675" y="265" width="230" height="135" rx="16" fill="#ede9fe" stroke="#1e293b" stroke-width="2"/><text x="790" y="312" font-size="23" font-weight="800">Область</text><text x="790" y="350" font-size="17" fill="#475569">tenant, role, purpose</text><text x="790" y="376" font-size="17" fill="#475569">класс памяти</text>
    <rect x="970" y="265" width="230" height="135" rx="16" fill="#fee2e2" stroke="#1e293b" stroke-width="2"/><text x="1085" y="312" font-size="23" font-weight="800">Карантин</text><text x="1085" y="350" font-size="17" fill="#475569">сомнение или конфликт</text><text x="1085" y="376" font-size="17" fill="#475569">ручной просмотр</text>
    <rect x="1265" y="265" width="250" height="135" rx="16" fill="#dcfce7" stroke="#1e293b" stroke-width="2"/><text x="1390" y="312" font-size="23" font-weight="800">Постоянная запись</text><text x="1390" y="350" font-size="17" fill="#475569">revision и retention</text><text x="1390" y="376" font-size="17" fill="#475569">удаление и аудит</text>
  </g>
  <g stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"><line x1="315" y1="332" x2="370" y2="332"/><line x1="610" y1="332" x2="665" y2="332"/><line x1="905" y1="332" x2="960" y2="332"/><line x1="1200" y1="332" x2="1255" y2="332"/></g>
  <rect x="235" y="535" width="1130" height="170" rx="18" fill="#ffffff" stroke="#1e293b" stroke-width="2" filter="url(#shadow)"/>
  <text x="800" y="585" font-family="Arial, sans-serif" font-size="25" font-weight="800" text-anchor="middle" fill="#1f2937">Чтение проходит отдельную политику</text>
  <text x="800" y="630" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#475569">фильтр арендатора • свежесть • доверие • лимит • причины включения</text>
  <text x="800" y="672" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#b91c1c">Найденный текст остается данными и не становится инструкцией</text>
  <text x="70" y="858" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#64748b">Agent Axiom / Архитектура безопасных ИИ-агентов</text>
</svg>
