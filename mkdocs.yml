site_name: Архитектура Безопасных AI-Агентов
site_description: Современная книга по архитектуре, безопасности, observability и управлению AI-агентами.
site_url: https://example.github.io/agent-arch/
repo_name: agent-arch
repo_url: https://github.com/your-org/agent-arch
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site

theme:
  name: material
  language: ru
  font:
    text: IBM Plex Sans
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: blue grey
      accent: amber
      toggle:
        icon: material/weather-night
        name: Темная тема
    - scheme: slate
      primary: blue grey
      accent: lime
      toggle:
        icon: material/weather-sunny
        name: Светлая тема
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - header.autohide
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
    - content.action.view
    - content.tabs.link

plugins:
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: ru
          name: Русский
          default: true
          build: true
          site_name: Архитектура Безопасных AI-Агентов
          nav_translations:
            Главная: Главная
            Книга: Книга
            План книги: План книги
            Часть I. Основания: Часть I. Основания
            Глава 1. Современная безопасная архитектура: Глава 1. Современная безопасная архитектура
            Приложения: Приложения
            Выбор стека публикации: Выбор стека публикации
            Источники: Источники
        - locale: en
          name: English
          build: true
          site_name: Secure AI Agent Architecture
          nav_translations:
            Главная: Home
            Книга: Book
            План книги: Book Plan
            Часть I. Основания: Part I. Foundations
            Глава 1. Современная безопасная архитектура: Chapter 1. Modern Secure Architecture
            Приложения: Appendix
            Выбор стека публикации: Publishing Stack
            Источники: Sources
        - locale: zh
          name: 中文
          build: true
          site_name: 安全 AI 智能体架构
          nav_translations:
            Главная: 首页
            Книга: 书籍
            План книги: 全书计划
            Часть I. Основания: 第一部分：基础
            Глава 1. Современная безопасная архитектура: 第 1 章：现代安全架构
            Приложения: 附录
            Выбор стека публикации: 发布技术栈
            Источники: 参考来源
  - search
  - glightbox
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/your-org/agent-arch

nav:
  - Главная: index.md
  - Книга:
      - План книги: book/plan.md
      - Часть I. Основания: book/part-i/index.md
      - Глава 1. Современная безопасная архитектура: book/part-i/chapter-1.md
  - Приложения:
      - Выбор стека публикации: appendix/stack.md
      - Источники: appendix/sources.md
