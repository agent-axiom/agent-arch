        - locale: en
          name: English
          build: true
          site_name: Secure AI Agent Architecture
          site_description: A modern book on architecture, safety, observability, and governance for AI agents.
          nav_translations:
            Главная: Home
            Start Here: Start Here
            Книга: Book
            План книги: Book Plan
            Часть I. Основания: Part I. Foundations
            Глава 1. Почему агенту нужна платформа, а не магия: Chapter 1. Why Agents Need a Platform, Not Magic
            Глава 2. Референсная архитектура безопасного агента: Chapter 2. Reference Architecture for a Safe Agent
            Практика. Instructions, routines и prompt templates: Practice. Instructions, Routines, and Prompt Templates
            Практика. Manager pattern vs handoffs: Practice. Manager Pattern vs Handoffs
            Часть II. Контур безопасности: Part II. Security Perimeter
            Глава 3. Контур безопасности и границы доверия: Chapter 3. Security Perimeter and Trust Boundaries
            Глава 4. Инструментальный шлюз, подтверждения и журнал аудита: Chapter 4. Tool Gateway, Approval, and Audit Trail
            Часть III. Память и знания: Part III. Memory and Knowledge
            Глава 5. Зачем агенту память и почему она опасна: Chapter 5. Why Agents Need Memory and Why It Is Dangerous
            Глава 6. Краткосрочная, долгосрочная и профильная память: Chapter 6. Short-Term, Long-Term, and Profile Memory
            Глава 7. Извлечение контекста, уплотнение и фоновые обновления: Chapter 7. Retrieval, Compaction, and Background Updates
            Часть IV. Инструменты и выполнение: Part IV. Tools and Execution
            Глава 8. Модель выполнения и каталог инструментов: Chapter 8. Execution Model and Tool Catalog
            Глава 9. Песочница выполнения и MCP как интеграционный контракт: Chapter 9. Sandbox Execution and MCP as an Integration Contract
            Практика. MCP для tools, A2A для agents: Practice. MCP for Tools, A2A for Agents
            Глава 10. Идемпотентность, повторы, лимиты запросов и границы отката: Chapter 10. Idempotency, Retries, Rate Limits, and Rollback Boundaries
            Часть V. Надежность и наблюдаемость: Part V. Reliability and Observability
            Глава 11. Трассы, спаны и структурированные события: Chapter 11. Traces, Spans, and Structured Events
            Глава 12. SLO для агентных систем: Chapter 12. SLO for Agent Systems
            Глава 13. Офлайн-оценки, онлайн-оценки и регрессионные шлюзы: Chapter 13. Offline Evals, Online Evals, and Regression Gates
            Часть VI. Организационная модель: Part VI. Organizational Model
            Глава 14. Платформенная команда и продуктовые команды: Chapter 14. Platform Team vs Product Teams
            Глава 15. Золотые пути, общие шлюзы и антизоопарк-подходы: Chapter 15. Golden Paths, Shared Gateways, and Anti-Zoo Patterns
            Часть VII. Эталонная реализация: Part VII. Reference Implementation
            Глава 16. Базовая схема рантайма: Chapter 16. Baseline Runtime Blueprint
            Глава 17. Слой политик и каталог возможностей: Chapter 17. Policy Layer and Capability Catalog
            Глава 18. Чеклист промышленного запуска: Chapter 18. Production Rollout Checklist
            Часть VIII. Жизненный цикл агентной системы: Part VIII. Agent System Lifecycle
            Глава 19. От SDLC к ADLC: Chapter 19. From SDLC to ADLC
            Глава 20. Change management для агентных систем: Chapter 20. Change Management for Agent Systems
            Приложения: Appendix
            Выбор стека публикации: Publishing Stack
            Дорожная карта для сообщества: Community Roadmap
            Глоссарий терминов: Glossary
            Шпаргалки: Cheat Sheets
            Опорный пакет: Reference Package
            Практические кейсы: Practical Case Studies
            Policy templates и checklists по кейсам: Policy Templates and Checklists by Use Case
            Источники: Sources
        - locale: zh
          name: 中文
          build: true
          site_name: 安全 AI 智能体架构
          site_description: 一本关于 AI 智能体架构、安全、可观测性与治理的现代书籍。
          nav_translations:
            Главная: 首页
            Start Here: 从这里开始
            Книга: 书籍
            План книги: 全书计划
            Часть I. Основания: 第一部分：基础
            Глава 1. Почему агенту нужна платформа, а не магия: 第 1 章：为什么智能体需要平台，而不是魔法
            Глава 2. Референсная архитектура безопасного агента: 第 2 章：安全智能体的参考架构
            Практика. Instructions, routines и prompt templates: 实践篇：Instructions、Routines 与 Prompt Templates
            Практика. Manager pattern vs handoffs: 实践篇：Manager Pattern vs Handoffs
            Часть II. Контур безопасности: 第二部分：安全边界
            Глава 3. Контур безопасности и границы доверия: 第 3 章：安全边界与信任边界
            Глава 4. Инструментальный шлюз, подтверждения и журнал аудита: 第 4 章：工具网关、审批与审计链路
            Часть III. Память и знания: 第三部分：记忆与知识
            Глава 5. Зачем агенту память и почему она опасна: 第 5 章：为什么智能体需要记忆，以及它为何危险
            Глава 6. Краткосрочная, долгосрочная и профильная память: 第 6 章：短期记忆、长期记忆与用户画像记忆
            Глава 7. Извлечение контекста, уплотнение и фоновые обновления: 第 7 章：检索、压缩与后台更新
            Часть IV. Инструменты и выполнение: 第四部分：工具与执行
            Глава 8. Модель выполнения и каталог инструментов: 第 8 章：执行模型与工具目录
            Глава 9. Песочница выполнения и MCP как интеграционный контракт: 第 9 章：沙箱执行与 MCP 作为集成契约
            Практика. MCP для tools, A2A для agents: 实践篇：MCP 用于 Tools，A2A 用于 Agents
            Глава 10. Идемпотентность, повторы, лимиты запросов и границы отката: 第 10 章：幂等性、重试、速率限制与回滚边界
            Часть V. Надежность и наблюдаемость: 第五部分：可靠性与可观测性
            Глава 11. Трассы, спаны и структурированные события: 第 11 章：追踪、跨度与结构化事件
            Глава 12. SLO для агентных систем: 第 12 章：智能体系统的 SLO
            Глава 13. Офлайн-оценки, онлайн-оценки и регрессионные шлюзы: 第 13 章：离线评测、在线评测与回归门禁
            Часть VI. Организационная модель: 第六部分：组织模型
            Глава 14. Платформенная команда и продуктовые команды: 第 14 章：平台团队与产品团队
            Глава 15. Золотые пути, общие шлюзы и антизоопарк-подходы: 第 15 章：黄金路径、共享网关与反“动物园”模式
            Часть VII. Эталонная реализация: 第七部分：参考实现
            Глава 16. Базовая схема рантайма: 第 16 章：基础运行时蓝图
            Глава 17. Слой политик и каталог возможностей: 第 17 章：策略层与能力目录
            Глава 18. Чеклист промышленного запуска: 第 18 章：生产上线检查清单
            Часть VIII. Жизненный цикл агентной системы: 第八部分：智能体系统生命周期
            Глава 19. От SDLC к ADLC: 第 19 章：从 SDLC 到 ADLC
            Глава 20. Change management для агентных систем: 第 20 章：智能体系统的 Change Management
            Приложения: 附录
            Выбор стека публикации: 发布技术栈
            Дорожная карта для сообщества: 社区路线图
            Глоссарий терминов: 术语表
            Шпаргалки: 速查清单
            Опорный пакет: 参考包
            Практические кейсы: 实战案例
            Policy templates и checklists по кейсам: 按场景组织的 Policy Templates 与 Checklists
            Источники: 参考来源
  - search
  - glightbox
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mermaid-init.js
  - javascripts/observable-plot.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/agent-axiom/agent-arch

