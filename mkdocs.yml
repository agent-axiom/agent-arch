site_name: Архитектура Безопасных AI-Агентов
site_description: Современная книга по архитектуре, безопасности, observability и управлению AI-агентами.
site_url: https://agent-axiom.github.io/agent-arch/
repo_name: agent-arch
repo_url: https://github.com/agent-axiom/agent-arch
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site

theme:
  name: material
  language: ru
  icon:
    alternate: material/translate
  font:
    text: IBM Plex Sans
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: blue grey
      accent: amber
      toggle:
        icon: material/weather-night
        name: Темная тема
    - scheme: slate
      primary: blue grey
      accent: lime
      toggle:
        icon: material/weather-sunny
        name: Светлая тема
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - header.autohide
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
    - content.action.view
    - content.tabs.link

plugins:
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: ru
          name: Русский
          default: true
          build: true
          site_name: Архитектура Безопасных AI-Агентов
          nav_translations:
            Главная: Главная
            Книга: Книга
            План книги: План книги
            Часть I. Основания: Часть I. Основания
            Глава 1. Почему агенту нужна платформа, а не магия: Глава 1. Почему агенту нужна платформа, а не магия
            Глава 2. Референсная архитектура безопасного агента: Глава 2. Референсная архитектура безопасного агента
            Часть II. Контур безопасности: Часть II. Контур безопасности
            Глава 3. Контур безопасности и границы доверия: Глава 3. Контур безопасности и границы доверия
            Глава 4. Tool gateway, approval и audit trail: Глава 4. Tool gateway, approval и audit trail
            Часть III. Память и знания: Часть III. Память и знания
            Глава 5. Зачем агенту память и почему она опасна: Глава 5. Зачем агенту память и почему она опасна
            Глава 6. Short-term, long-term и profile memory: Глава 6. Short-term, long-term и profile memory
            Глава 7. Retrieval, compaction и background updates: Глава 7. Retrieval, compaction и background updates
            Часть IV. Инструменты и выполнение: Часть IV. Инструменты и выполнение
            Глава 8. Execution model и каталог инструментов: Глава 8. Execution model и каталог инструментов
            Приложения: Приложения
            Выбор стека публикации: Выбор стека публикации
            Источники: Источники
        - locale: en
          name: English
          build: true
          site_name: Secure AI Agent Architecture
          nav_translations:
            Главная: Home
            Книга: Book
            План книги: Book Plan
            Часть I. Основания: Part I. Foundations
            Глава 1. Почему агенту нужна платформа, а не магия: Chapter 1. Why Agents Need a Platform, Not Magic
            Глава 2. Референсная архитектура безопасного агента: Chapter 2. Reference Architecture for a Safe Agent
            Часть II. Контур безопасности: Part II. Security Perimeter
            Глава 3. Контур безопасности и границы доверия: Chapter 3. Security Perimeter and Trust Boundaries
            Глава 4. Tool gateway, approval и audit trail: Chapter 4. Tool Gateway, Approval, and Audit Trail
            Часть III. Память и знания: Part III. Memory and Knowledge
            Глава 5. Зачем агенту память и почему она опасна: Chapter 5. Why Agents Need Memory and Why It Is Dangerous
            Глава 6. Short-term, long-term и profile memory: Chapter 6. Short-Term, Long-Term, and Profile Memory
            Глава 7. Retrieval, compaction и background updates: Chapter 7. Retrieval, Compaction, and Background Updates
            Часть IV. Инструменты и выполнение: Part IV. Tools and Execution
            Глава 8. Execution model и каталог инструментов: Chapter 8. Execution Model and Tool Catalog
            Приложения: Appendix
            Выбор стека публикации: Publishing Stack
            Источники: Sources
        - locale: zh
          name: 中文
          build: true
          site_name: 安全 AI 智能体架构
          nav_translations:
            Главная: 首页
            Книга: 书籍
            План книги: 全书计划
            Часть I. Основания: 第一部分：基础
            Глава 1. Почему агенту нужна платформа, а не магия: 第 1 章：为什么智能体需要平台，而不是魔法
            Глава 2. Референсная архитектура безопасного агента: 第 2 章：安全智能体的参考架构
            Часть II. Контур безопасности: 第二部分：安全边界
            Глава 3. Контур безопасности и границы доверия: 第 3 章：安全边界与信任边界
            Глава 4. Tool gateway, approval и audit trail: 第 4 章：工具网关、审批与审计链路
            Часть III. Память и знания: 第三部分：记忆与知识
            Глава 5. Зачем агенту память и почему она опасна: 第 5 章：为什么智能体需要记忆，以及它为何危险
            Глава 6. Short-term, long-term и profile memory: 第 6 章：短期记忆、长期记忆与用户画像记忆
            Глава 7. Retrieval, compaction и background updates: 第 7 章：检索、压缩与后台更新
            Часть IV. Инструменты и выполнение: 第四部分：工具与执行
            Глава 8. Execution model и каталог инструментов: 第 8 章：执行模型与工具目录
            Приложения: 附录
            Выбор стека публикации: 发布技术栈
            Источники: 参考来源
  - search
  - glightbox
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mermaid-init.js
  - javascripts/observable-plot.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/agent-axiom/agent-arch

nav:
  - Главная: index.md
  - Книга:
      - План книги: book/plan.md
      - Часть I. Основания: book/part-i/index.md
      - Глава 1. Почему агенту нужна платформа, а не магия: book/part-i/chapter-1.md
      - Глава 2. Референсная архитектура безопасного агента: book/part-i/chapter-2.md
      - Часть II. Контур безопасности: book/part-ii/index.md
      - Глава 3. Контур безопасности и границы доверия: book/part-ii/chapter-3.md
      - Глава 4. Tool gateway, approval и audit trail: book/part-ii/chapter-4.md
      - Часть III. Память и знания: book/part-iii/index.md
      - Глава 5. Зачем агенту память и почему она опасна: book/part-iii/chapter-5.md
      - Глава 6. Short-term, long-term и profile memory: book/part-iii/chapter-6.md
      - Глава 7. Retrieval, compaction и background updates: book/part-iii/chapter-7.md
      - Часть IV. Инструменты и выполнение: book/part-iv/index.md
      - Глава 8. Execution model и каталог инструментов: book/part-iv/chapter-8.md
  - Приложения:
      - Выбор стека публикации: appendix/stack.md
      - Источники: appendix/sources.md
