site_name: Архитектура Безопасных AI-Агентов
site_description: Современная книга по архитектуре, безопасности, наблюдаемости и управлению AI-агентами.
site_url: https://agent-axiom.github.io/agent-arch/
repo_name: agent-arch
repo_url: https://github.com/agent-axiom/agent-arch
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site

theme:
  name: material
  language: ru
  icon:
    alternate: material/translate
  font:
    text: IBM Plex Sans
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: blue grey
      accent: amber
      toggle:
        icon: material/weather-night
        name: Темная тема
    - scheme: slate
      primary: blue grey
      accent: lime
      toggle:
        icon: material/weather-sunny
        name: Светлая тема
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - header.autohide
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
    - content.action.view
    - content.tabs.link

plugins:
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: ru
          name: Русский
          default: true
          build: true
          site_name: Архитектура Безопасных AI-Агентов
