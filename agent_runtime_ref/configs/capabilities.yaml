capabilities:
  search_docs:
    owner: knowledge_platform
    mode: read
    transport: mcp
    tool_principal: svc-knowledge-reader
    risk_tier: low
    network_access: restricted
    allowed_egress:
      - docs.internal
    timeout_seconds: 5
    approval: none
  create_ticket:
    owner: support_platform
    mode: write
    transport: gateway
    tool_principal: svc-ticket-writer
    risk_tier: high
    network_access: brokered
    allowed_egress:
      - tickets.internal
    timeout_seconds: 15
    approval: manager
    idempotency_key_required: true
